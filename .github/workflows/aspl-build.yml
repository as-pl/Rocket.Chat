# AS-PL customization: dispatch an exact fork commit to our existing monorepo builders.
name: AS-PL build request
on:
  push:
    branches: [aspl]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dispatch:
    if: github.repository == 'as-pl/Rocket.Chat' && github.ref == 'refs/heads/aspl'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Verify AS-PL workflow boundaries
        run: node --test .github/tests/aspl-workflows.test.cjs
      - uses: actions/create-github-app-token@v2
        id: app
        with:
          app-id: ${{ vars.ROCKETCHAT_APP_ID }}
          private-key: ${{ secrets.ROCKETCHAT_APP_PRIVATE_KEY }}
          owner: as-pl
          repositories: as-pl-monorepo
          permission-actions: write
      - name: Request candidate build
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          gh api --method POST repos/as-pl/as-pl-monorepo/actions/workflows/rocketchat-build.yml/dispatches \
            -f ref=webpage-backend -f "inputs[source_sha]=$SOURCE_SHA"
