services:
  mongo:
    image: mongodb/mongodb-community-server:7.0-ubuntu2204
    container_name: rocketchat-mongo
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - rocketchat_mongo_data:/data/db

  mongo-init-replica:
    image: mongodb/mongodb-community-server:7.0-ubuntu2204
    container_name: rocketchat-mongo-init
    depends_on:
      - mongo
    restart: "no"
    entrypoint: >
      bash -lc "
        until mongosh --host mongo --eval 'db.adminCommand(\"ping\")' >/dev/null 2>&1; do
          sleep 2;
        done;
        mongosh --host mongo --eval '
          rs.initiate({
            _id: \"rs0\",
            members: [{ _id: 0, host: \"mongo:27017\" }]
          });
        ' || true;
      "

  rocketchat:
    image: ghcr.io/local/rocket.chat:dev
    container_name: rocketchat
    restart: unless-stopped
    depends_on:
      - mongo
      - mongo-init-replica
    ports:
      - "3000:3000"
    environment:
      ROOT_URL: http://localhost:3000
      PORT: 3000
      MONGO_URL: mongodb://mongo:27017/rocketchat?replicaSet=rs0
      MONGO_OPLOG_URL: mongodb://mongo:27017/local?replicaSet=rs0

volumes:
  rocketchat_mongo_data:
